  <text x="960" y="160" font-family="Geist, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="0.92">track 014 · 0.94</text>

  <text x="64" y="128" font-family="Newsreader, Georgia, serif" font-size="78" font-weight="500" fill="#FFFFFF">Jeffrin Singh R</text>
  <text x="66" y="178" font-family="Geist, Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="url(#name)">Applied AI Engineer · Full Stack Developer</text>
  <text x="66" y="226" font-family="Geist, Segoe UI, Arial, sans-serif" font-size="22" fill="#E8F6F2" opacity="0.9">Document AI · OCR · Computer Vision · FastAPI · React</text>

