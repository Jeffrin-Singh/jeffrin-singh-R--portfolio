      <stop offset="0%" stop-color="#0E6B5C" />
      <stop offset="45%" stop-color="#1F4E8C" />
      <stop offset="100%" stop-color="#7A2E8E" />
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93FAFD" />
      <stop offset="50%" stop-color="#FFC2F4" />
      <stop offset="100%" stop-color="#FFD7A8" />
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5DD6FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#5DD6FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF86E9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF86E9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9F3F" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FF9F3F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)" />
  <circle cx="1040" cy="90" r="190" fill="url(#orbA)" />
  <circle cx="1120" cy="250" r="160" fill="url(#orbB)" />
  <circle cx="880" cy="290" r="140" fill="url(#orbC)" />

  <!-- detection frame, a nod to the computer-vision work -->
